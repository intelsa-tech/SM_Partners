let currentId = candidates[0].id;

function buildTabs() {
  const nav = document.getElementById('candidateTabs');
  nav.innerHTML = '';
  candidates.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'candidate-tab' + (c.id === currentId ? ' active' : '');
    btn.textContent = c.name;
    btn.dataset.id = c.id;
    btn.addEventListener('click', () => {
      currentId = c.id;
      document.querySelectorAll('.candidate-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(c.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    nav.appendChild(btn);
  });
}

      <p style="margin-top:14px;font-size:11px;color:var(--gray-text);font-style:italic;">Click any candidate above to open their full profile, or use the tabs at the top of the page.</p>
    </div>

    <div class="content-card" style="margin-top:16px;">
      <div class="section-label">How to Read Each Profile</div>
      <p style="font-size:12px;color:var(--gray-text);line-height:1.7;">Every candidate card includes: (1) core profile and contact information, (2) an interview scorecard across six dimensions on a 10-point scale, (3) career highlights drawn directly from the CV with dates and responsibilities, (4) narrative insights on domain fit and communication style, and (5) a list of points worth probing during the full English interview. Three candidates (Piero Vásquez, Sofia Mendez, and Rocío Demiddi) include preliminary AI-assisted interview recordings. One other (Kevin Miranda) had his English communication validated through live screening with the Intelsa recruiter &mdash; recording temporarily unavailable due to a platform issue. The remaining two will complete the preliminary AI-assisted interview as part of the next step.</p>
    </div>
  `;
}

function renderCandidate(c) {
  const body = document.getElementById('pageBody');

  const tagsHtml = c.tags.map(t => `<span class="tag ${t.cls}">${t.label}</span>`).join('');

  const profileHtml = c.profileRows.map(([k,v]) =>
    `<tr><td>${k}</td><td>${v}</td></tr>`
  ).join('');

  const barsHtml = c.bars.map(b => `
    <div class="bar-item">
      <div class="bar-top">
        <span class="bar-name">${b.label}</span>
        <span class="bar-val${b.green ? ' green-val' : ''}">${b.val}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill${b.green ? ' gfill' : ''}" style="width:${b.pct}%"></div>
      </div>
    </div>
  `).join('');

  const highlightsHtml = c.highlights.map(h => `
    <div class="career-item">
      <div class="career-role">${h.role}</div>
      <div class="career-company">${h.company}</div>
      <div class="career-dates">${h.dates}</div>
      <div class="career-desc">${h.desc}</div>
    </div>
  `).join('');

  const insightsHtml = c.insights.map(i => `
    <div class="insight-block">
      <div class="insight-title">${i.title}</div>
      <div class="insight-text">${i.text}</div>
    </div>
  `).join('');

  const watchHtml = c.watchItems ? `
    <div class="watch-box">
      <div class="watch-title">Points to Probe in the Full Interview</div>
      <ul class="watch-list">
        ${c.watchItems.map(w => `<li>${w}</li>`).join('')}
      </ul>
    </div>
  ` : '';

  const mediaHtml = c.hasMedia ? `
    <div class="content-card media-card">
      <div class="section-label">Preliminary Interview Recording</div>
      <p style="font-size:12px;color:var(--gray-text);margin-bottom:10px;">${c.mediaLabel}</p>
      <div class="media-wrap">
        <iframe src="${c.mediaUrl}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" allowfullscreen title="Interview recording — ${c.fullName}"${c.mediaAspect ? ` style="aspect-ratio: ${c.mediaAspect};"` : ''}></iframe>
      </div>
    </div>
  ` : `
    <div class="content-card media-card">
      <div class="section-label">Next Step</div>
      <div class="media-note">${c.mediaNote}</div>
    </div>
  `;

  const contactHtml = c.contact ? `<div class="head-location" style="margin-top:4px;font-weight:500;color:var(--orange);">${c.contact}</div>` : '';

  body.innerHTML = `
    <div class="profile-header">
      <div class="profile-strip ${c.strip}"></div>
      <div class="profile-head-inner">
        <div class="avatar-circle ${c.avatarClass}">${c.initials}</div>
        <div class="profile-info">
          <div class="head-name">${c.fullName}</div>
          <div class="head-title">${c.title}</div>
          <div class="head-location">${c.location}</div>
          ${contactHtml}
          <div class="tags-row">${tagsHtml}</div>
        </div>
        <div class="profile-right">
          <div class="score-circle ${c.scoreClass}">
            <span class="score-num">${c.scoreVal}</span>
            <span class="score-denom">/ 10</span>
          </div>
          <span class="rec-badge ${c.recClass}">${c.recLabel}</span>
        </div>
      </div>
    </div>

    <div class="content-grid">

      <div class="content-card">
        <div class="section-label">Candidate Profile</div>
        <table class="info-table">${profileHtml}</table>
        <hr style="border:none;border-top:1px solid var(--gray-mid);margin:16px 0;">
        <div class="section-label">Interview Scorecard</div>
        ${barsHtml}
      </div>

      <div class="content-card">
        <div class="section-label">Career Highlights (from CV)</div>
        ${highlightsHtml}
      </div>

      <div class="content-card full">
        <div class="section-label">Profile Insights</div>
        ${insightsHtml}
      </div>

      ${watchHtml}

      ${mediaHtml}

      <div class="verdict-box ${c.verdictClass}">
        <p>${c.verdict}</p>
      </div>

    </div>
  `;
}

function render(id) {
  const c = candidates.find(x => x.id === id);
  if (!c) return;
  if (c.isOverview) {
    renderOverview();
  } else {
    renderCandidate(c);
  }
}

buildTabs();
render(currentId);
</script>
</body>
</html>
